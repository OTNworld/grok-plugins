name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/grok-build-worker/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: plugins/grok-build-worker/mcp/package-lock.json
      - run: npm ci
      - run: npm test
